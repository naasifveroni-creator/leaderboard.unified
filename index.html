<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Δ Unified Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
html,body{width:100%;height:100%;background:#f2f5f9;overflow:hidden}
body{display:flex;justify-content:center;align-items:center;padding:0}
.slide-deck{width:100vw;height:100vh;background:#f2f5f9;overflow:hidden;position:relative}
.slides-wrapper{position:relative;width:100%;height:100%;overflow:hidden}

.fullscreen-btn{position:absolute;bottom:2vh;right:1.5vw;z-index:100;background:rgba(255,255,255,0.8);border:1px solid rgba(0,0,0,0.1);color:#475569;border-radius:8px;padding:0.5vh 0.8vw;font-size:1.8vh;cursor:pointer;transition:all 0.3s;backdrop-filter:blur(8px);display:flex;align-items:center;gap:0.4vw;font-weight:500}
.fullscreen-btn:hover{background:rgba(255,255,255,0.95);color:#0f172a;transform:scale(1.05)}
#adminAccess{position:fixed;bottom:2vh;right:8vw;z-index:100}
#adminAccess a{color:rgba(0,0,0,0.3);text-decoration:none;font-size:1.4vh;font-weight:400;padding:0.3vh 0.6vw;border-radius:4px;background:rgba(255,255,255,0.6);backdrop-filter:blur(4px);border:1px solid rgba(0,0,0,0.05)}
#adminAccess a:hover{color:#3b82f6}

.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;visibility:hidden;transition:opacity 0.8s ease,transform 0.8s ease;display:flex;flex-direction:column;transform:scale(0.98)}
.slide.active{opacity:1;visibility:visible;position:relative;transform:scale(1)}

#slide0{background:url('assets/slides/slide-title.webp.jpg') center/cover no-repeat,#f2f5f9}
#slide1{background:url('assets/slides/slide-data.webp.jpg') center/cover no-repeat,#f2f5f9}
#slide2,#slide3,#slide4,#slide5,#slide6,#slide7{background:#f2f5f9;padding:0}

.slide-counter{position:absolute;top:1.5vh;right:2vw;color:rgba(0,0,0,0.2);font-size:1.4vh;font-weight:600;z-index:5}
.slide-counter .current{color:#0b1a33;font-size:2vh}

.progress-container{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(0,0,0,0.05);z-index:30}
.progress-bar{height:100%;width:0%;background:#d32f2f;transition:width 0.1s linear}

.nav-controls{position:absolute;bottom:1%;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:1.5vw;z-index:20;pointer-events:none}
.nav-controls button,.nav-controls .dot{pointer-events:auto}
.arrow{background:rgba(255,255,255,0.8);color:#0b1a33;border:1px solid rgba(0,0,0,0.08);border-radius:50%;width:3vh;height:3vh;font-size:2vh;cursor:pointer;transition:0.3s;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.arrow:hover{background:#d32f2f;color:#fff;border-color:#d32f2f;transform:scale(1.1)}
.dots{display:flex;gap:0.8vw}
.dot{width:1vh;height:1vh;border-radius:50%;background:rgba(0,0,0,0.1);border:none;cursor:pointer;transition:0.3s;padding:0}
.dot.active{background:#d32f2f;transform:scale(1.4);box-shadow:0 0 20px rgba(211,47,47,0.3)}

/* ===== SIS – ORIGINAL SINGLE COLUMN TABLE ===== */
.sis-slide-wrapper{flex:1;width:100%;padding:0.5vh 1.5vw 1vh 1.5vw;display:flex;flex-direction:column;height:100%;background:#f2f5f9}
.sis-header{background:rgba(255,255,255,0.85);backdrop-filter:blur(16px);padding:0.3vh 2vw;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.2vh 1vw;flex-shrink:0;min-height:9vh;border-bottom:2px solid rgba(211,47,47,0.2);box-shadow:0 4px 30px rgba(0,0,0,0.04);border-radius:0 0 12px 12px;margin:0 0.5vw}
.sis-header .logo-area{display:flex;align-items:center;gap:1vw}
.sis-header .logo-area img{height:7vh;width:auto}
.sis-header .logo-area h1{font-weight:300;font-size:2.4vh;color:#0b1a33}
.sis-header .logo-area h1 span{font-weight:800;color:#d32f2f}

.sis-behavior-tags{display:flex;flex-wrap:wrap;align-items:center;gap:0.2vh 0.5vw}
.sis-behavior-tags .tag{color:#0b1a33;font-size:1.1vh;font-weight:600;text-transform:uppercase;padding:0.3vh 0.8vw;border-radius:30px;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.06);opacity:0;transform:translateY(15px);transition:all 0.4s ease}
.sis-behavior-tags .tag.visible{opacity:1;transform:translateY(0)}
.sis-behavior-tags .divider{color:rgba(0,0,0,0.1);font-size:1.1vh}
.sis-behavior-tags .tag.red{color:#fff;background:linear-gradient(135deg,#d32f2f,#b71c1c);border-color:rgba(211,47,47,0.4);box-shadow:0 0 15px rgba(211,47,47,0.2)}
.sis-behavior-tags .tag.coach{color:#fff;background:linear-gradient(135deg,#2a4a7f,#1a3050);border-color:rgba(42,74,127,0.4)}

.sis-title{font-size:3.2vh;font-weight:800;color:#0b1a33;text-align:center;padding:0.3vh 0 0.2vh 0;flex-shrink:0}
.sis-title::after{content:'';display:block;width:60px;height:3px;background:#d32f2f;margin:0.1vh auto 0;border-radius:10px}
.sis-title .week-date{font-weight:800;font-size:2.2vh;color:#d32f2f;background:rgba(0,0,0,0.04);padding:0.1vh 2vw;border-radius:30px;display:inline-block}

.sis-table-wrap{flex:1;overflow:hidden;position:relative;margin-top:0.2vh}
.sis-table-wrap .scroll-wrapper{width:100%;height:100%;overflow-y:auto;overflow-x:hidden;mask-image:linear-gradient(to bottom,transparent 0%,black 5%,black 95%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 5%,black 95%,transparent 100%)}
.sis-table-wrap .scroll-inner{padding:0.2vh 0.2vw}
.sis-table-wrap table{width:100%;border-collapse:collapse;font-size:2.2vh}
.sis-table-wrap th{background:linear-gradient(135deg,#f1f5f9,#e2e8f0);color:#0b1a33;font-weight:700;padding:0.8vh 1vw;text-align:left;border-bottom:3px solid #d32f2f;font-size:1.8vh;text-transform:uppercase;letter-spacing:0.05em;position:sticky;top:0;z-index:10}
.sis-table-wrap td{padding:0.8vh 1vw;border-bottom:1px solid rgba(0,0,0,0.05);color:#0b1a33;font-weight:500}
.sis-table-wrap .rank-col{width:10%;color:#64748b;font-weight:600;text-align:center}
.sis-table-wrap .name-col{text-align:left}
.sis-table-wrap .score-col{text-align:right;font-weight:700;color:#d32f2f;width:15%}
.sis-table-wrap tr.top1 td{background:linear-gradient(90deg,rgba(27,138,78,0.08),rgba(211,47,47,0.02));border-left:4px solid #1b8a4e}
.sis-table-wrap tr.top1 .rank-col{color:#1b8a4e;font-weight:900}
.sis-table-wrap tr.top1 .score-col{color:#1b8a4e}
.sis-table-wrap tr.amber td{background:linear-gradient(90deg,rgba(230,126,34,0.08),rgba(211,47,47,0.02));border-left:4px solid #e67e22}
.sis-table-wrap tr.amber .rank-col{color:#e67e22;font-weight:900}
.sis-table-wrap tr.amber .score-col{color:#e67e22}

.sis-footer{flex-shrink:0;min-height:12vh;border-top:1px solid rgba(0,0,0,0.05);display:flex;align-items:center;justify-content:center;padding:0.3vh 2vw;margin-top:auto}
.footer-animation{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.spray-fill{position:absolute;left:0;top:0;width:0%;height:100%;background:linear-gradient(90deg,#d32f2f,#f2f5f9,#d32f2f);filter:blur(12px);opacity:0.5;animation:sprayWidth 8s ease-in-out infinite;border-radius:4px}
@keyframes sprayWidth{0%{width:0%;opacity:0}10%{opacity:0.5}100%{width:100%;opacity:0.5}}
.spray-text{font-size:7vh;font-weight:900;letter-spacing:1.2vw;color:#f2f5f9;background:linear-gradient(90deg,#d32f2f,#0b1a33,#d32f2f);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;position:relative;z-index:3;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:textReveal 8s ease-in-out infinite}
@keyframes textReveal{0%{clip-path:inset(0 100% 0 0)}100%{clip-path:inset(0 0% 0 0)}}
.plane{position:absolute;top:50%;transform:translateY(-50%);left:-80px;width:60px;height:40px;z-index:5;animation:flyPlane 8s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(211,47,47,0.3))}
@keyframes flyPlane{0%{left:-80px}50%{left:calc(100% - 40px)}100%{left:calc(100% + 20px)}}

/* ===== COMPARISON – ORIGINAL LAYOUT ===== */
.comp-slide-wrapper{flex:1;width:100%;padding:1vh 3vw 2vh 3vw;display:flex;flex-direction:column;gap:2vh;height:100%;background:#f2f5f9}
.comp-slide-wrapper .metric-header{display:flex;align-items:center;gap:1.2vw;flex-shrink:0}
.comp-slide-wrapper .metric-header h2{font-size:4.2vh;font-weight:600;color:#0b1a33}
.comp-slide-wrapper .metric-header .unit-badge{font-size:2vh;font-weight:500;color:#475569;background:#f1f5f9;padding:0.2vh 1.2vw;border-radius:40px;border:1px solid #e2e8f0}
.comp-slide-wrapper .card-row{flex:1;display:flex;flex-direction:row;gap:2vw;min-height:0;height:70%}
.comp-slide-wrapper .centre-card{flex:1;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:2.8vh;border:1px solid rgba(255,255,255,0.9);box-shadow:0 8px 32px rgba(0,0,0,0.04);display:flex;flex-direction:row;align-items:center;padding:1.5vh 2.5vw;position:relative;overflow:hidden}
.comp-slide-wrapper .centre-card::before{content:'';position:absolute;left:0;top:15%;height:70%;width:0.6vh;border-radius:0 6px 6px 0;background:var(--brand-colour)}
.comp-slide-wrapper .centre-card.tp{--brand-colour:#3b82f6}
.comp-slide-wrapper .centre-card.wns{--brand-colour:#f59e0b}
.comp-slide-wrapper .chart-area{flex:0 0 28%;max-width:28%;aspect-ratio:1/1;max-height:100%;display:flex;align-items:center;justify-content:center}
.comp-slide-wrapper .chart-area canvas{width:100%!important;height:100%!important}
.comp-slide-wrapper .details-area{flex:1;padding-left:2vw;display:flex;flex-direction:column;justify-content:center;gap:0.2vh}
.comp-slide-wrapper .details-area .centre-name{font-size:2.4vh;font-weight:600;color:#94a3b8;text-transform:uppercase;display:flex;align-items:center;gap:0.6vw}
.comp-slide-wrapper .details-area .main-value{font-size:7vh;font-weight:700;color:#0b1a33;letter-spacing:-0.03em;line-height:1;display:flex;align-items:baseline;gap:1vw}
.comp-slide-wrapper .details-area .main-value .trend{font-size:3vh;font-weight:600}
.comp-slide-wrapper .trend.up{color:#10b981}
.comp-slide-wrapper .trend.down{color:#ef4444}
.comp-slide-wrapper .trend.flat{color:#94a3b8}
.comp-slide-wrapper .details-area .comparison-row{display:flex;align-items:center;gap:1.5vw;font-size:2vh;color:#475569;flex-wrap:wrap}
.comp-slide-wrapper .details-area .comparison-row .prev-label{background:#f1f5f9;padding:0.2vh 0.8vw;border-radius:30px;border:1px solid #e2e8f0;font-size:1.8vh}
.comp-slide-wrapper .details-area .comparison-row .gap-label{font-weight:500}
.comp-slide-wrapper .details-area .comparison-row .gap-label.above{color:#10b981}
.comp-slide-wrapper .details-area .comparison-row .gap-label.below{color:#f59e0b}
.comp-slide-wrapper .details-area .comparison-row .gap-label.well-below{color:#ef4444}
.comp-slide-wrapper .details-area .insight-row{display:flex;align-items:center;gap:1vw;font-size:2vh;font-weight:500;color:#475569;flex-wrap:wrap}
.comp-slide-wrapper .details-area .insight-row .insight-badge{background:#f1f5f9;padding:0.2vh 0.8vw;border-radius:30px;border:1px solid #e2e8f0;font-size:1.8vh;display:inline-flex;align-items:center;gap:0.3vw}

.comp-slide-wrapper .summary-grid-vertical{flex:1;display:flex;flex-direction:column;gap:2vh;width:100%;height:100%}
.comp-slide-wrapper .summary-card-vertical{flex:1;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-radius:2.8vh;border:1px solid rgba(255,255,255,0.9);box-shadow:0 8px 32px rgba(0,0,0,0.04);padding:1.5vh 2vw;display:flex;flex-direction:column;justify-content:center}
.comp-slide-wrapper .summary-card-vertical .metric-title{font-size:2.8vh;font-weight:700;color:#0b1a33;margin-bottom:0.8vh;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.comp-slide-wrapper .summary-card-vertical .metric-title .unit{font-size:1.8vh;font-weight:500;color:#94a3b8;background:#f1f5f9;padding:0.1vh 1vw;border-radius:40px;border:1px solid #e2e8f0}
.comp-slide-wrapper .summary-row-vertical{display:flex;align-items:center;justify-content:space-between;padding:0.6vh 0;border-bottom:1px solid #e2e8f0;flex-shrink:0}
.comp-slide-wrapper .summary-row-vertical:last-child{border-bottom:none}
.comp-slide-wrapper .summary-row-vertical .centre-info{display:flex;align-items:center;gap:0.6vw;font-weight:600;color:#475569;font-size:2vh;flex:0 0 15%}
.comp-slide-wrapper .summary-row-vertical .centre-info .dot{width:1.4vh;height:1.4vh;border-radius:50%;display:inline-block;flex-shrink:0}
.comp-slide-wrapper .summary-row-vertical .values{display:flex;align-items:center;gap:1.5vw;flex:1;justify-content:flex-end;flex-wrap:wrap}
.comp-slide-wrapper .summary-row-vertical .values .current{font-size:2.8vh;font-weight:700;color:#0b1a33}
.comp-slide-wrapper .summary-row-vertical .values .change{font-size:2vh;font-weight:500;min-width:4.5vw}
.comp-slide-wrapper .summary-row-vertical .values .change.up{color:#10b981}
.comp-slide-wrapper .summary-row-vertical .values .change.down{color:#ef4444}
.comp-slide-wrapper .summary-row-vertical .values .change.flat{color:#94a3b8}
.comp-slide-wrapper .summary-row-vertical .values .gap-badge{font-size:1.8vh;padding:0.2vh 1vw;border-radius:30px;background:#f1f5f9;border:1px solid #e2e8f0;font-weight:500;display:inline-flex;align-items:center;gap:0.2vw;white-space:nowrap}
.comp-slide-wrapper .summary-row-vertical .values .gap-badge.above{color:#10b981;border-color:#10b981;background:rgba(16,185,129,0.08)}
.comp-slide-wrapper .summary-row-vertical .values .gap-badge.below{color:#f59e0b;border-color:#f59e0b;background:rgba(245,158,11,0.08)}
.comp-slide-wrapper .summary-row-vertical .values .gap-badge.well-below{color:#ef4444;border-color:#ef4444;background:rgba(239,68,68,0.08)}

@media(max-aspect-ratio:16/9){.sis-header .logo-area h1{font-size:2vh}.sis-header .logo-area img{height:6vh}.sis-behavior-tags .tag{font-size:1vh}.sis-title{font-size:2.8vh}.sis-title .week-date{font-size:2vh}.sis-table-wrap table{font-size:2vh}.sis-table-wrap th{font-size:1.6vh}.fullscreen-btn{font-size:1.2vh;padding:0.3vh 0.6vw}.spray-text{font-size:6vh;letter-spacing:1vw}.plane{width:55px;height:40px}.sis-footer{min-height:12vh}.comp-slide-wrapper .metric-header h2{font-size:3.2vh}.comp-slide-wrapper .details-area .main-value{font-size:5vh}.comp-slide-wrapper .card-row{flex-direction:column;height:auto}.comp-slide-wrapper .centre-card{flex-direction:column;padding:1.5vh}.comp-slide-wrapper .chart-area{flex:0 0 30%;width:30%;max-width:30%}.comp-slide-wrapper .details-area{padding-left:0;align-items:center;text-align:center}}
@media(max-width:768px){.slide-counter{display:none}.sis-behavior-tags .divider{display:none}.sis-behavior-tags .tag{font-size:0.7vh;padding:0.2vh 0.4vw}.sis-header .logo-area h1{font-size:1.4vh}.sis-header .logo-area img{height:4vh}.sis-title .week-date{font-size:1.6vh}.sis-table-wrap table{font-size:1.6vh}.sis-table-wrap th{font-size:1.2vh}.nav-controls{bottom:0.5%}.arrow{width:2vh;height:2vh;font-size:1.2vh}.dot{width:0.6vh;height:0.6vh}.fullscreen-btn{bottom:1.5vh;right:1vw;font-size:1.2vh;padding:0.3vh 0.5vw}#adminAccess{right:10vw;bottom:1.5vh}#adminAccess a{font-size:1.2vh;padding:0.2vh 0.5vw}.spray-text{font-size:4vh;letter-spacing:2vw}.plane{width:30px;height:22px;left:-40px}.sis-footer{min-height:8vh}.comp-slide-wrapper{padding:1vh 2vw}.comp-slide-wrapper .centre-card{border-radius:2vh}.comp-slide-wrapper .metric-header h2{font-size:2.4vh}.comp-slide-wrapper .details-area .main-value{font-size:4vh}.comp-slide-wrapper .summary-card-vertical .metric-title{font-size:2vh}.comp-slide-wrapper .summary-row-vertical .values .current{font-size:2vh}}
</style>
</head>
<body>
<div class="slide-deck">
<div class="slides-wrapper">
<button class="fullscreen-btn" id="fullscreenBtn"><span class="icon">⛶</span> FULL</button>
<div id="adminAccess"><a href="admin.html" target="_blank">⚙ ADMIN</a></div>
<div id="slidesContainer"></div>
<div class="nav-controls">
<button class="arrow" id="prevBtn">◀</button>
<div class="dots" id="dotsContainer"></div>
<button class="arrow" id="nextBtn">▶</button>
</div>
<div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
</div>
</div>

<script>
// ===== FETCH DATA =====
let leaderboardData = null;
let comparisonData = null;
let currentSlide = 0;
let intervalId = null;
let slides = [];

async function loadData() {
 try {
  const [lb, comp] = await Promise.all([
   fetch('data/leaderboard.json?t='+Date.now()),
   fetch('data/comparison.json?t='+Date.now())
  ]);
  if(!lb.ok || !comp.ok) throw new Error('Failed to fetch');
  leaderboardData = await lb.json();
  comparisonData = await comp.json();
  return true;
 } catch(e) {
  console.error('Load error:', e);
  return false;
 }
}

// ===== RENDER SIS – ORIGINAL SINGLE COLUMN =====
function renderSISTable(data, type) {
 const items = type === 'agents' ? data.agents : data.teams;
 if(!items || items.length === 0) return '<div style="padding:2rem;text-align:center;color:#94a3b8;">No data</div>';
 let html = '<div class="sis-table-wrap"><div class="scroll-wrapper"><div class="scroll-inner"><table><thead><tr><th class="rank-col">Rank</th><th class="name-col">Name</th><th class="score-col">SIS%</th></tr></thead><tbody>';
 items.forEach((item, idx) => {
  const rank = item.rank || idx+1;
  let cls = '';
  if(rank === 1) cls = 'top1';
  else if(rank === 2) cls = 'amber';
  html += `<tr class="${cls}"><td class="rank-col">#${rank}</td><td class="name-col">${item.name}</td><td class="score-col">${item.score}</td></tr>`;
 });
 html += '</tbody></table></div></div></div>';
 return html;
}

function renderSISSlide(data, type) {
 const isAgents = type === 'agents';
 const title = isAgents ? 'Top Performing Agents – SIS' : 'Top Performing Teams – SIS';
 const week = data.week || 'Week of ...';
 const table = renderSISTable(data, type);
 return `
 <div class="sis-slide-wrapper">
  <div class="sis-header">
   <div class="logo-area"><img src="assets/logos/delta-logo-ribbon.png" alt="Delta" onerror="this.style.display='none'" /><h1><span>DELTA</span> · SIS</h1></div>
   <div class="sis-behavior-tags">
    <span class="tag visible">GREET ME</span><span class="divider">•</span>
    <span class="tag visible">RECOGNIZE ME</span><span class="divider">•</span>
    <span class="tag visible">BE KIND TO ME</span><span class="divider">•</span>
    <span class="tag visible">INFORM ME</span><span class="divider">•</span>
    <span class="tag red visible">CONSISTENTLY EXECUTED</span><span class="divider">•</span>
    <span class="tag coach visible">LEADERS AS COACHES</span>
   </div>
  </div>
  <div class="sis-title">${title} <span class="week-date">${week}</span></div>
  ${table}
  <div class="sis-footer">
   <div class="footer-animation"><div class="spray-fill"></div>
   <svg class="plane" viewBox="0 0 80 50" fill="none">
    <path d="M15 25 L70 20 L80 25 L70 30 L15 25Z" fill="#d32f2f" stroke="#b71c1c" stroke-width="1"/>
    <path d="M45 22 L60 10 L68 15 L52 25 L45 22Z" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
    <path d="M45 28 L60 40 L68 35 L52 25 L45 28Z" fill="#ffffff" stroke="#d32f2f" stroke-width="1.5"/>
    <path d="M15 25 L5 15 L15 20 L15 25Z" fill="#d32f2f"/>
    <path d="M15 25 L5 35 L15 30 L15 25Z" fill="#d32f2f"/>
    <path d="M15 23 L8 18 L15 22 L15 23Z" fill="#ffffff" stroke="#d32f2f" stroke-width="1"/>
    <path d="M15 27 L8 32 L15 28 L15 27Z" fill="#ffffff" stroke="#d32f2f" stroke-width="1"/>
    <circle cx="78" cy="25" r="3" fill="#fdb913"/>
    <ellipse cx="82" cy="25" rx="8" ry="2" fill="#fdb913" opacity="0.8"/>
    <path d="M65 23 Q72 23 68 27 Q65 27 65 23Z" fill="#0b1a33" opacity="0.6"/>
   </svg><div class="spray-text">DELTA</div></div>
  </div>
 </div>`;
}

// ===== COMPARISON HELPERS =====
function getGapText(v,t,h){const d=h?v-t:t-v;const g=Math.abs(d);return h?d>=0?'+'+g.toFixed(1):g.toFixed(1):d>=0?g.toFixed(1):'+'+g.toFixed(1)}
function getGapClass(v,t,h){if(h){if(v>=t)return'above';if(v>=t*0.9)return'below';return'well-below'}else{if(v<=t)return'above';if(v<=t*1.1)return'below';return'well-below'}}
function getInsight(c,p,h,u){const d=c-p;if(Math.abs(d)<0.01)return'→ Steady at '+c+u;const pct=(d/Math.abs(p))*100;const s=d>0?'+':'';const dir=d>0?(h?'improving':'declining'):(h?'declining':'improving');return(d>0?'📈':'📉')+' '+dir+' ('+s+pct.toFixed(1)+'%)'}

function renderComparisonDetail(data, metric) {
 const target = data.targets[metric];
 const isHigher = metric !== 'CHT';
 let html = '<div class="comp-slide-wrapper"><div class="metric-header"><h2>'+metric+'</h2><span class="unit-badge">Target: '+target+(metric==='CHT'?'s':'%')+'</span></div><div class="card-row">';
 data.centres.forEach(c => {
  const m = c.metrics[metric];
  const current = m.current;
  const previous = m.previous;
  const gapText = getGapText(current, target, isHigher);
  const gapClass = getGapClass(current, target, isHigher);
  const insight = getInsight(current, previous, isHigher, metric==='CHT'?'s':'%');
  const trend = current > previous ? 'up' : (current < previous ? 'down' : 'flat');
  const arrow = current > previous ? '↑' : (current < previous ? '↓' : '→');
  html += '<div class="centre-card '+c.name.toLowerCase()+'">';
  html += '<div class="chart-area"><canvas id="chart-'+metric+'-'+c.name+'"></canvas></div>';
  html += '<div class="details-area"><div class="centre-name"><span class="dot" style="background:'+c.colour+';"></span> '+c.name+'</div>';
  html += '<div class="main-value">'+current+(metric==='CHT'?'s':'%')+' <span class="trend '+trend+'">'+arrow+'</span></div>';
  html += '<div class="comparison-row"><span class="prev-label">Prev: '+previous+(metric==='CHT'?'s':'%')+'</span><span class="gap-label '+gapClass+'">'+gapText+' vs target</span></div>';
  html += '<div class="insight-row"><span class="insight-badge">'+insight+'</span></div></div></div>';
 });
 html += '</div></div>';
 return html;
}

function renderSummary(data) {
 const metrics = ['SIS','IFSR','CHT'];
 let html = '<div class="comp-slide-wrapper"><div class="metric-header"><h2>📊 Summary Report</h2><span class="unit-badge">All Metrics</span></div><div class="summary-grid-vertical">';
 metrics.forEach(metric => {
  const target = data.targets[metric];
  const isHigher = metric !== 'CHT';
  const unit = metric==='CHT'?'s':'%';
  html += '<div class="summary-card-vertical"><div class="metric-title">'+metric+'<span class="unit">Target: '+target+unit+'</span></div>';
  data.centres.forEach(c => {
   const m = c.metrics[metric];
   const current = m.current;
   const prev = m.previous;
   const gapText = getGapText(current, target, isHigher);
   const gapClass = getGapClass(current, target, isHigher);
   const change = current - prev;
   const changeClass = change > 0 ? 'up' : (change < 0 ? 'down' : 'flat');
   const sym = change > 0 ? '↑' : (change < 0 ? '↓' : '→');
   const pct = prev !== 0 ? (change / Math.abs(prev)) * 100 : 0;
   html += '<div class="summary-row-vertical"><div class="centre-info"><span class="dot" style="background:'+c.colour+';"></span> '+c.name+'</div>';
   html += '<div class="values"><span class="current">'+current+unit+'</span>';
   html += '<span class="change '+changeClass+'">'+sym+' '+Math.abs(pct).toFixed(1)+'%</span>';
   html += '<span class="gap-badge '+gapClass+'">'+gapText+'</span></div></div>';
  });
  html += '</div>';
 });
 html += '</div></div>';
 return html;
}

// ===== BUILD SLIDES =====
function buildSlides() {
 slides = [
  {type:'title'},{type:'data-image'},{type:'agents'},{type:'teams'},
  {type:'comparison-detail',metric:'SIS'},{type:'comparison-detail',metric:'IFSR'},
  {type:'comparison-detail',metric:'CHT'},{type:'summary'}
 ];
 const container = document.getElementById('slidesContainer');
 const dotsContainer = document.getElementById('dotsContainer');
 container.innerHTML = '';
 dotsContainer.innerHTML = '';

 slides.forEach((slide, idx) => {
  const div = document.createElement('div');
  div.className = 'slide' + (idx === 0 ? ' active' : '');
  div.id = 'slide'+idx;
  div.dataset.index = idx;
  let content = '';
  if(slide.type === 'title' || slide.type === 'data-image') {
   content = '<div class="slide-counter"><span class="current">'+(idx+1)+'</span> / '+slides.length+'</div>';
  } else if(slide.type === 'agents' || slide.type === 'teams') {
   content = renderSISSlide(leaderboardData, slide.type);
  } else if(slide.type === 'comparison-detail') {
   content = renderComparisonDetail(comparisonData, slide.metric);
  } else if(slide.type === 'summary') {
   content = renderSummary(comparisonData);
  }
  div.innerHTML = content;
  container.appendChild(div);

  const dot = document.createElement('button');
  dot.className = 'dot' + (idx === 0 ? ' active' : '');
  dot.dataset.index = idx;
  dot.addEventListener('click', ()=>goTo(idx));
  dotsContainer.appendChild(dot);
 });

 setTimeout(() => {
  slides.forEach((slide) => {
   if(slide.type === 'comparison-detail') {
    const metric = slide.metric;
    const data = comparisonData;
    data.centres.forEach(c => {
     const canvas = document.getElementById('chart-'+metric+'-'+c.name);
     if(canvas) {
      const ctx = canvas.getContext('2d');
      const current = c.metrics[metric].current;
      const target = data.targets[metric];
      const isHigher = metric !== 'CHT';
      const remaining = isHigher ? Math.max(0, 100 - current) : Math.max(0, current);
      new Chart(ctx, {
       type:'doughnut',
       data:{labels:['Current','Remaining'],datasets:[{data:[current,remaining],backgroundColor:[c.colour,'rgba(0,0,0,0.06)'],borderWidth:0}]},
       options:{cutout:'75%',plugins:{legend:{display:false}},responsive:true,maintainAspectRatio:true}
      });
     }
    });
   }
  });
 }, 200);

 updateUI();
 startAutoSlide();
}

function updateUI() {
 document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
 document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===currentSlide));
 document.getElementById('progressBar').style.width = ((currentSlide+1)/slides.length*100)+'%';
}

function goTo(idx){if(idx<0)idx=slides.length-1;if(idx>=slides.length)idx=0;currentSlide=idx;updateUI();resetAutoSlide()}
function nextSlide(){goTo(currentSlide+1)}
function prevSlide(){goTo(currentSlide-1)}
function startAutoSlide(){if(intervalId)clearInterval(intervalId);intervalId=setInterval(nextSlide,15000)}
function resetAutoSlide(){if(intervalId)clearInterval(intervalId);startAutoSlide()}

document.getElementById('prevBtn').addEventListener('click',prevSlide);
document.getElementById('nextBtn').addEventListener('click',nextSlide);
document.getElementById('fullscreenBtn').addEventListener('click',()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()});

// ===== INIT =====
async function init() {
 const loaded = await loadData();
 if(!loaded) {
  document.getElementById('slidesContainer').innerHTML = '<div style="padding:2rem;text-align:center;color:#d32f2f;background:white;border-radius:16px;margin:2rem;"><h2>❌ Data Files Not Found</h2><p>Make sure these files exist:</p><code>data/leaderboard.json</code><br/><code>data/comparison.json</code></div>';
  return;
 }
 buildSlides();
}

init();

// ===== REMOTE CONTROL =====
setInterval(async()=>{try{const r=await fetch('command.json?t='+Date.now());const c=await r.json();if(c.command==='next')nextSlide()}catch(e){}},3000);
</script>
